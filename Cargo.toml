[workspace]
members = [".", "crates/yespower"]

[package]
name = "tideminer"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
description = "Tidecoin-only yespower CPU miner"
license = "MIT AND BSD-2-Clause"
repository = "https://github.com/tidecoin/tideminer"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ctrlc = "3.4"
hex = "0.4"
libc = "0.2"
# Openwall C kernel: optional (`--features c-kernel`) for A/B and as a fallback;
# also the independent oracle in tests.
rust-yespower = { version = "=0.3.0", features = ["std"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
tidecoin-yespower = { path = "crates/yespower" }
url = "2.5"
webpki-roots = { version = "1", optional = true }

# Metal GPU worker (macOS only; enabled at run time with --gpu). Other targets
# never build these dependencies.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-metal = { version = "0.3", optional = true }

[features]
default = ["tls", "gpu"]
# Stratum over TLS (rustls + ring; ring compiles a little C/assembly). Without it
# the miner is pure Rust and supports stratum+tcp only.
tls = ["dep:rustls", "dep:webpki-roots", "dep:rustls-pki-types"]
c-kernel = ["dep:rust-yespower"]
gpu = ["dep:block2", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]

# The Openwall C reference (tests re-hash every share with it) builds with GCC/Clang
# flags; Windows tests use the Rust kernel instead.
[target.'cfg(not(windows))'.dev-dependencies]
rust-yespower = { version = "=0.3.0", features = ["std"] }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false

[lints.rust]
# Denied everywhere except the small, documented OS-binding module (src/os.rs).
unsafe_code = "deny"

# Tests and debug builds still hash at full speed.
[profile.dev.package.rust-yespower]
opt-level = 3

[profile.dev.package.tidecoin-yespower]
opt-level = 3

# The kernel is generic (Hasher<K>), so it is compiled inside the crate that uses
# it: the miner itself must be optimized too, or debug/test builds hash ~100x slower.
[profile.dev.package.tideminer]
opt-level = 3
